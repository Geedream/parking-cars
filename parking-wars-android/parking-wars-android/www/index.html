<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />

    <meta name="theme-color" content="#080c18" />
    <title>Parking Wars</title>
    <style>
      html,
      body {

        align-items: center;

      .box {

      }
      .glyph {
        font: 700 64px/1 -apple-system, "Segoe UI", Roboto, sans-serif;

        font-size: 14px;
        line-height: 1.7;
        color: #7f93ab;
        margin: 0 0 18px;
      }
      button {
        appearance: none;
        border: 1px solid rgba(49, 231, 255, 0.5);
        background: rgba(49, 231, 255, 0.12);
        color: #d9fbff;
        font-size: 15px;
        padding: 11px 26px;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="glyph">P</div>
      <p>连不上服务器，检查一下网络再试。</p>
      <p>Offline — check your connection and try again.</p>
      <button onclick="location.href='https://project-73d17537.eazo.dev/?source=android'">重试 / Retry</button>
